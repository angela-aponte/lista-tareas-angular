<main class="app">
  <h1>Lista de tareas</h1>

  <div class="nueva">
    <input #nueva placeholder="¿Qué hay que hacer?" (keydown.enter)="agregar(nueva)" />
    <button (click)="agregar(nueva)">Agregar</button>
  </div>

  <div class="filtros">
    @for (f of filtros; track f) {
      <button [class.activo]="filtro() === f" (click)="cambiarFiltro(f)">{{ f }}</button>
    }
  </div>

  <ul class="lista">
    @for (t of visibles(); track t.id) {
      <li>
        <input type="checkbox" [checked]="t.hecha" (change)="alternar(t.id)" />
        <span [class.hecha]="t.hecha">{{ t.texto }}</span>
        <button class="borrar" (click)="eliminar(t.id)">Eliminar</button>
      </li>
    } @empty {
      <li class="vacio">No hay tareas para mostrar.</li>
    }
  </ul>

  <p class="contador">{{ pendientes() }} pendientes</p>
</main>
